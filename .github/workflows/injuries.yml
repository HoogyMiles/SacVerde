name: Update NFL injuries
on:
  schedule:
    # every 3 hours Wed-Sun (UTC days; covers Wed-Sun Pacific: Wed/Thu/Fri reports + game days)
    - cron: "47 */3 * * 0,3,4,5,6"
    - cron: "47 0,3,6 * * 1"          # Sunday evening Pacific (Monday UTC)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: data-commit, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/injuries.py
      - name: Commit if changed
        run: |
          git config user.name "sacverde-bot"
          git config user.email "actions@users.noreply.github.com"
          git add injuries.json
          git diff --cached --quiet || (git commit -m "NFL injuries update" && git pull --rebase && git push)
