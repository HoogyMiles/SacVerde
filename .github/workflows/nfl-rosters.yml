name: Update NFL rosters
on:
  schedule:
    - cron: "17 13 * * *"     # daily, ~6am PT
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/nfl_rosters.py
      - run: python tools/player_stats.py
      - name: Commit if changed
        run: |
          git config user.name "sacverde-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl_rosters.json player_stats.json
          git diff --cached --quiet || (git commit -m "NFL rosters + player stats update" && git push)
